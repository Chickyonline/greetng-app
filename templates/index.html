<!DOCTYPE html>

<html>

<head>
    <title>Greeting App</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>Greeting App</h1>

        <p>Enter your name</p>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Your name"
                required
            >

            <button type="submit">
                Greet Me
            </button>

        </form>

        {% if greeting %}

            <div class="greeting">
                {{ greeting }}
            </div>

        {% endif %}

    </div>

</body>

</html>
